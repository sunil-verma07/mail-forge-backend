<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f0f4f8; font-family:Arial,Helvetica,sans-serif;">

<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color:#f0f4f8;">
  <tr>
    <td align="center">

      <table border="0" cellpadding="0" cellspacing="0" style="width:100%;">

        <!-- HEADER — blue linear gradient, logos as inline content -->
        <tr>
          <td style="background-color:#1e4080; background-image:linear-gradient(135deg, #0f2554 0%, #1e4080 45%, #2a5fc0 100%); padding:18px 28px;">
            <table border="0" cellpadding="0" cellspacing="0" width="100%">
              <tr>
                <td style="vertical-align:middle;">
                  <img src="cid:yakaLogo" height="64" alt="YAKA"
                       style="display:block; height:64px; border:0; outline:none;" />
                </td>
                <td align="right" style="vertical-align:middle;">
                  <img src="cid:iitilLogo" height="48" alt="IITIL"
                       style="display:block; height:48px; border:0; outline:none;" />
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- SUBJECT BAR -->
        <tr>
          <td style="background-color:#f8fafc; padding:16px 28px; border-left:1px solid #dde3ed; border-right:1px solid #dde3ed;">
            <p style="margin:0; font-size:11px; color:#8896b3; text-transform:uppercase; letter-spacing:1px; font-family:Arial,Helvetica,sans-serif;">Subject</p>
            <p style="margin:4px 0 0 0; font-size:18px; font-weight:700; color:#1a1a2e; font-family:Arial,Helvetica,sans-serif;">{{subject}}</p>
          </td>
        </tr>

        <!-- BODY -->
        <tr>
          <td style="background-color:#ffffff; padding:36px 28px; border-left:1px solid #dde3ed; border-right:1px solid #dde3ed; font-size:15px; line-height:1.75; color:#374151; font-family:Arial,Helvetica,sans-serif;">
            {{emailContent}}
          </td>
        </tr>

        <!-- FOOTER BAND — same gradient, 40px tall (half of 80px avatar) -->
        <tr>
          <td style="background-color:#1e3a6e; background-image:linear-gradient(135deg, #0f2554 0%, #1e4080 45%, #2a5fc0 100%); height:40px; line-height:40px; font-size:0; border-left:1px solid #2a4a80; border-right:1px solid #2a4a80;">
            &nbsp;
          </td>
        </tr>

        <!-- SENDER ROW — pulled up 40px so avatar straddles the band -->
        <tr>
          <td style="background-color:#ffffff; padding:0 28px 4px 28px; border-left:1px solid #dde3ed; border-right:1px solid #dde3ed;">
            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-top:-40px;">
              <tr>
                <td width="96" style="vertical-align:top; padding-right:16px;">
                  <img src="cid:senderImage"
                       width="80" height="80" alt="HR Desk"
                       style="display:block; width:80px; height:80px; border-radius:40px; border:3px solid #ffffff; outline:2px solid #dde3ed;" />
                </td>
                <td style="vertical-align:bottom; padding-top:42px; padding-bottom:8px;">
                  <p style="margin:0 0 2px 0; font-size:20px; font-weight:700; color:#1a1a2e; font-family:Arial,Helvetica,sans-serif;">{{senderName}}</p>
                  <p style="margin:0; font-size:13px; color:#6b7a99; font-family:Arial,Helvetica,sans-serif;">Team HR &nbsp;&bull;&nbsp; @iitil.com</p>
                </td>
                <td align="right" style="vertical-align:bottom; padding-top:42px; padding-bottom:8px;">
                  <table border="0" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="padding-left:8px;"><a href="#"><img src="cid:instagramIcon" width="22" height="22" alt="Instagram" style="display:block;border:0;" /></a></td>
                      <td style="padding-left:8px;"><a href="#"><img src="cid:xIcon" width="22" height="22" alt="X" style="display:block;border:0;" /></a></td>
                      <td style="padding-left:8px;"><a href="#"><img src="cid:facebookIcon" width="22" height="22" alt="Facebook" style="display:block;border:0;" /></a></td>
                      <td style="padding-left:8px;"><a href="#"><img src="cid:linkedinIcon" width="22" height="22" alt="LinkedIn" style="display:block;border:0;" /></a></td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- FOOTER CHIPS — width:100%, equal 25% columns, centered content -->
        <tr>
          <td style="background-color:#ffffff; padding:10px 28px 24px 28px; border-left:1px solid #dde3ed; border-right:1px solid #dde3ed; border-bottom:1px solid #dde3ed;">
            <table border="0" cellpadding="0" cellspacing="0" width="100%">
              <tr>

                <!-- Clock -->
                <td width="25%" style="padding-right:5px;">
                  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-radius:30px; background-color:#f5f8ff; border:1px solid #e0e8f5;">
                    <tr>
                      <td align="center" style="padding:6px 6px; vertical-align:middle; font-size:11px; color:#3a4a6b; font-family:Arial,Helvetica,sans-serif; white-space:nowrap;">
                        <img src="cid:clockIcon" width="13" height="13" alt="" style="vertical-align:middle; margin-right:5px; border:0;" />10:00 am to 7:00 pm
                      </td>
                    </tr>
                  </table>
                </td>

                <!-- Calendar -->
                <td width="25%" style="padding-left:5px; padding-right:5px;">
                  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-radius:30px; background-color:#f5f8ff; border:1px solid #e0e8f5;">
                    <tr>
                      <td align="center" style="padding:6px 6px; vertical-align:middle; font-size:11px; color:#3a4a6b; font-family:Arial,Helvetica,sans-serif; white-space:nowrap;">
                        <img src="cid:calendarIcon" width="13" height="13" alt="" style="vertical-align:middle; margin-right:5px; border:0;" />Monday to Friday
                      </td>
                    </tr>
                  </table>
                </td>

                <!-- Email -->
                <td width="25%" style="padding-left:5px; padding-right:5px;">
                  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-radius:30px; background-color:#f5f8ff; border:1px solid #e0e8f5;">
                    <tr>
                      <td align="center" style="padding:6px 6px; vertical-align:middle; font-size:11px; font-family:Arial,Helvetica,sans-serif; white-space:nowrap;">
                        <img src="cid:emailIcon" width="13" height="13" alt="" style="vertical-align:middle; margin-right:5px; border:0;" /><a href="mailto:hrdesk@iitil.com" style="color:#3a4a6b; text-decoration:none;">hrdesk@iitil.com</a>
                      </td>
                    </tr>
                  </table>
                </td>

                <!-- Website -->
                <td width="25%" style="padding-left:5px;">
                  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-radius:30px; background-color:#f5f8ff; border:1px solid #e0e8f5;">
                    <tr>
                      <td align="center" style="padding:6px 6px; vertical-align:middle; font-size:11px; font-family:Arial,Helvetica,sans-serif; white-space:nowrap;">
                        <img src="cid:websiteIcon" width="13" height="13" alt="" style="vertical-align:middle; margin-right:5px; border:0;" /><a href="https://www.iitil.com" style="color:#3a4a6b; text-decoration:none;">www.iitil.com</a>
                      </td>
                    </tr>
                  </table>
                </td>

              </tr>
            </table>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
